version: 1
endpoints:
  - name: premium-weather
    method: GET
    path: /v1/weather
    price_sats: 21
    response:
      status: 200
      content_type: application/json
      headers:
        X-Plan: premium
      body: '{"forecast":"clear"}'

  - name: premium-summary
    method: POST
    path: /v1/summary
    price_sats: 55
    response:
      status: 201
      content_type: application/json
      body: '{"status":"generated"}'
